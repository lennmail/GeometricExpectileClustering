name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev --group test

      - name: Generate API docs
        run: uv run sphinx-apidoc -o docs/source/api geomexp --force

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

      - name: Generate coverage badge JSON
        run: |
          TOTAL=$(uv run coverage report --format=total)
          if [ "$TOTAL" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$TOTAL" -ge 75 ]; then COLOR="green"
          elif [ "$TOTAL" -ge 60 ]; then COLOR="yellowgreen"
          elif [ "$TOTAL" -ge 40 ]; then COLOR="yellow"
          else COLOR="red"; fi
          mkdir -p docs/build/html
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${TOTAL}%\",\"color\":\"${COLOR}\"}" > docs/build/html/coverage.json

      - name: Build Sphinx docs
        run: uv run sphinx-build -b html -W --keep-going docs/source docs/build/html

      - name: Disable Jekyll
        run: touch docs/build/html/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
