repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # 1) Lint + autofix (must run BEFORE formatting when using --fix)
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      # 2) Format
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      # 3) Type check (run once for the whole project each commit)
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml .
        language: system
        pass_filenames: false
